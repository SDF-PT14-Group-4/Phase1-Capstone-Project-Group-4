services:
  - type: web
    name: globaltaste-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app:create_app db upgrade && gunicorn --bind 0.0.0.0:$PORT 'app:create_app()'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: globaltaste-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://phase1-capstone-project-group-4.netlify.app

databases:
  - name: globaltaste-db
    databaseName: globaltaste
    user: globaltaste
    region: oregon
    plan: free
    ipAllowList: []
